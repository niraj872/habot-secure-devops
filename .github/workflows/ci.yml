name: Secure Fail-Closed CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-security:
    name: Quality and Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Python formatting gate
        working-directory: backend
        run: ruff format --check .

      - name: Python lint gate
        working-directory: backend
        run: ruff check .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt gate
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (validation mode)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Gitleaks secret gate
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy IaC security gate
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: "HIGH,CRITICAL"

      - name: Django tests
        working-directory: backend
        run: python manage.py test

      - name: JSON schema test
        run: python tests/test_schema.py

  terraform-plan:
    name: Authenticated Terraform Plan Gate
    runs-on: ubuntu-latest
    needs: quality-security
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_bucket_name: ${{ vars.GCP_BUCKET_NAME }}
      TF_VAR_analytics_group: ${{ vars.GCP_ANALYTICS_GROUP }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'asia-south2' }}
      TF_VAR_data_region: ${{ vars.GCP_DATA_REGION || 'IN-NCR' }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed configuration check
        shell: bash
        run: |
          set -euo pipefail
          for name in TF_VAR_project_id TF_VAR_bucket_name TF_VAR_analytics_group TF_STATE_BUCKET WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required CI/CD configuration: ${name}"
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Terraform init with remote state
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=habot/devops"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -lock=false


